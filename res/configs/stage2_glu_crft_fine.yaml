# Apply after stage0 and stage1. Existing 1/4 local matcher remains the fine
# branch; the coarse stage has already been trained at the same full FOV.
local_matcher:
  enabled: true
  radius: 6
  temperature: 0.07
  candidate_chunk: 9
  refinement_channels: 32

fine_interaction:
  enabled: true

loss:
  weights:
    local: 1.0
    coarse_flow: 1.0

vtmot_train:
  lr: 2.0e-5
