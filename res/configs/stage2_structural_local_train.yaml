# Step 3 of the structural-prior route: train the 1/4 shared projection against
# the frozen 600-step coarse field.
#
# Merge this on top of the *same* stack that produced the frozen field:
#   --config res/configs/registration.yaml
#   --overlay res/configs/stage0_structural_prior.yaml
#   --overlay res/configs/ab_spatial_prior32.yaml
#   --overlay res/configs/stage2_structural_local_train.yaml
# train_vtmot builds the model from these files only, not from the checkpoint's
# saved config, so leaving out ab_spatial_prior32.yaml would silently train
# against a coarse field that is not the one that was measured.
#
# Why freezing the whole encoder is necessary: the shared pyramid is sequential
# (1/2 -> 1/4 -> 1/8), so every gradient that reaches stage_4 also reaches
# stage_2 and the shallow adapters, and stage_8 consumes stage_4's output.
# freeze_coarse therefore holds the encoder, the SA-CA transformer and the global
# matcher fixed, which leaves fine_interaction as the only trainable module: a
# 1x1 shared 1/4 projection, a 1/8 top-down context projection and their fusion.
#
# freeze_local_refinement holds the residual head at zero, so the final field is
# still the coarse field and every reported local_* number isolates the candidate
# distribution rather than a learned correction.
#
# radius 4 (81 candidates, +/-16 px) instead of 8: the step-1 measurement put the
# truth-centred argmax at 25.06 px against a 25.98 px random floor, so a wider
# window only multiplies fruitless candidates, and global_window2_coverage was
# already 1.0 at +/-16 px.
#
# The flow, edge and smoothness terms are constant here (the coarse field is
# frozen and the head is held at zero), so ``local`` is the only loss that
# produces a gradient.  Judge this stage by the local NLL against its two
# references -- ln(81) = 4.3944 for a uniform field and 1.7069 for the best field
# a sigma=0.75 soft target allows -- and by truthcentre_local_argmax_epe_px
# against the 13.70 px random floor on the same 80 frames, never by the total loss.
local_matcher:
  enabled: true
  radius: 4
  # Logits are cos / T.  Holding the ~18% of the mass that a perfect field reaches
  # needs a top-versus-rest logit gap near 2.9, i.e. a cosine gap near 0.20.  The
  # trained 1/8 features have that -- match_p_max 0.129 over 4800 candidates at
  # T=0.07 implies a cosine gap near 0.46 -- but the untrained 1/4 features reach
  # only a few percent of the way from uniform, a cosine gap nearer 0.02.  At
  # T=0.07 the softmax cannot form a peak at all and the local NLL pins to
  # ln(81); T=0.01 supplies the missing order of magnitude and enlarges the
  # gradient reaching the features roughly sevenfold.
  temperature: 0.01
  candidate_chunk: 9
  refinement_channels: 32

fine_interaction:
  enabled: true
  # The module computes fine + gain * fused.  Two runs at 300 steps bracket the
  # effect: with the gain pinned at zero the local NLL ended 0.47% *worse* than a
  # uniform field, because gain * fused has zero derivative with respect to the
  # projections; with gain 0.1 it learned, staying below the zero-gain run at
  # every logged step and reaching 4.4% of the way from uniform (4.3944) to the
  # best soft-target value (1.7069), but only at about 1.5% per hundred steps.
  # A gain of 0.1 still leaves 90% of the feature entering the matcher identical
  # to the frozen stage_4 output, so start at 1.0 and let the adapter act fully.
  gain_init: 1.0

loss:
  weights:
    local: 1.0

vtmot_train:
  freeze_coarse: true
  freeze_local_refinement: true
  # About 49k parameters are trainable and batch size is one, so 300 steps at
  # 1e-4 left the trend buried in batch-to-batch noise (train_epe ranged 2.2 to
  # 13.2).  Raise the rate and use --run full for 3000 steps.
  lr: 3.0e-4
