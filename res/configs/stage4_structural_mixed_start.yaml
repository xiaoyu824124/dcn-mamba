# Step 4: residual supervision from mixed starting points.
#
# The r2 run showed what the loop does with the current supervision: from a
# correct start it drifts (2.02 -> 3.58 px natural, 6.21 -> 11.14 px on the +48
# stress set, with round two's mean exactly parallel to round one's), it tracks
# only ~8% of the translation it is asked for, and its confidence ranks below
# chance on both stress sets (AUC 0.30 / 0.33, only 4-12% of frames above 0.5).
# No gate setting improved on the raw confidence across the three scenarios --
# halving the correction and a 0.5 threshold each cost part of the gain on the
# stress sets -- so the gate is not where this gets fixed.  Two things that
# table does *not* show: gating round one also changes what round two starts
# from, and the final error depends on the correction's magnitude as well as its
# ranking, so a reversed ranking is consistent with it but not isolated by it.
#
# One knob differs from stage3_structural_iterative_r2.yaml and nothing else:
#
#   vtmot_train.init_flow_mix  a fraction of steps start from a *known* field
#                              instead of the model's own coarse centre:
#                              the truth (correct correction is zero), a
#                              symmetric +/-4/8/16 px translation in one of eight
#                              directions (correct correction is its negation),
#                              a smooth bounded field, or the real coarse field.
#
# Every loss weight is identical to r2, refine_proposal included at zero, so the
# original loss stands as the control: the start distribution is the only change.
#
# Reach: the loop runs at 1/4 and its step bound is 2 cells = 8 px per round, so
# two rounds can walk back at most 16 px.  A 10 px sample therefore needs both
# rounds, and the acceptance test asks for a monotone decrease rather than a
# single-round fix.  Starting outside the search window means there is no
# directly correct candidate there; the r2 coverage did grow between rounds
# (0.32 -> 0.39 on +48), so some of it can be walked in rather than being out of
# reach.  What this run is *not* asked to do is fix a 48 px displacement: on the
# natural set the residual is inside the window for 99.4% of pixels, and the two
# open questions are how to get below 6.55 px on ordinary input and how to stay
# put when the start is already right.
#
# Acceptance is checked on the trained checkpoint and needs all four of these,
# because any one alone is passable by a degenerate model: a loop that never
# updates looks perfect from the truth and fixes no known offset, and a loop
# that always slams the full step fixes offsets while drifting off a correct
# start.  The +-48 px sets are no longer part of the routine; their measured
# numbers stay as a capability boundary.
#
#   natural, every round       res.evaluate_vtmot                       (headline)
#   truth start                res.evaluate_vtmot --diagnose-local-centre
#   +-4 / +-8 / +-16 px        res.evaluate_vtmot --diagnose-known-residual
#   +-48 px                    retired as a routine test
#
# Merge for training (evaluation rebuilds the base config from the checkpoint):
#   --config res/configs/registration.yaml
#   --overlay res/configs/stage0_structural_prior.yaml
#   --overlay res/configs/ab_spatial_prior32.yaml
#   --overlay res/configs/stage3_structural_iterative_r2.yaml
#   --overlay res/configs/stage4_structural_mixed_start.yaml
local_matcher:
  enabled: false

fine_interaction:
  enabled: true
  gain_init: 1.0

fine_cross_attention:
  enabled: true
  gain_init: 1.0
  window_size: 5
  hidden_channels: 16

iterative_refinement:
  enabled: true
  radius: 8
  iterations: 2
  evidence_channels: 16
  hidden_channels: 32
  candidate_chunk: 9
  temperature: 0.07
  max_step_cells: 2.0
  remove_mean: false

loss:
  weights:
    local: 0.0
    # Unchanged from r2: the original loss is the control for this run.
    refine: 1.0
    refine_match: 0.1
    refine_confidence: 0.5
    refine_smooth: 0.05
    # The pre-gate proposal term exists and is tested, but stays off here: this
    # round changes the start distribution only.  It is the natural next single
    # knob if mixed starts fix the drift but the update head still answers "move"
    # on an already-aligned input.
    refine_proposal: 0.0

vtmot_data:
  eval_frame_stride: 10

vtmot_train:
  freeze_coarse: true
  selection_metric: relative_epe
  # Same budget as r2 so the two runs are comparable step for step.
  lr: 3.0e-4
  init_flow_mix:
    probability: 0.75
    # Truth first: the case the loop currently fails outright.
    truth_weight: 0.4
    # Sized from the natural set's own coarse error, not from the stress sets:
    # median 6.857 px, p90 10.224 px, window coverage 99.4%.  So 3/6/10 px span
    # just under the median to just past the p90, and 10 px needs both rounds of
    # an 8 px bound -- the case that has to decrease over rounds rather than in
    # one.  +-48 px is not sampled: it is a recorded capability boundary, and a
    # start that far out is the coarse stage's problem, not two rounds'.
    translation_px: [3.0, 6.0, 10.0]
    local_px: 8.0
