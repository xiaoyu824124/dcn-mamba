# Coarse-only 1/8 correspondence experiment.  Keep all other settings fixed
# across the four representation arms below.
architecture: spatial_frequency

encoder:
  base_channels: 24
  out_channels: 64
  blocks_per_scale: 2
  eps: 1.0e-6
  normalise: false

spatial_frequency:
  mode: spatial
  window_size: 5

coarse_transformer:
  enabled: true
  num_layers: 2
  num_heads: 4
  ffn_ratio: 2

global_matcher:
  temperature: 0.07
  learnable_temperature: true
  return_correlation: false
  max_tokens: 4800
  affine_projection: true
  affine_ridge: 1.0e-3
  dual_softmax: true

local_matcher:
  enabled: false

loss:
  weights:
    match: 1.0
    flow: 1.0
    affine: 10.0
    mind: 0.0
    edge: 0.25
    # The coarse flow is an exact 6-DoF projection, whose finite differences are
    # its linear part, so a |grad flow| penalty biases the fitted scale and shear
    # toward zero -- the hardest free parameters of the misalignment.  With
    # affine_projection the WLS ridge already regularises, so leave this at zero.
    smooth: 0.0
    local: 0.0
    coarse_local: 0.0
    global_flow: 0.0
    coarse_flow: 0.0

vtmot_train:
  lr: 1.0e-4
