# Independent single-frame IR--visible registration experiment.
# Stages 1--8 use this configuration; real VTMOT integration remains separate.
mind:
  patch_size: 3
  radius: 1
  eps: 1.0e-6

encoder:
  base_channels: 24
  out_channels: 64
  blocks_per_scale: 2
  eps: 1.0e-6

global_matcher:
  temperature: 0.07
  learnable_temperature: true
  # Full-frame training does not consume the visualisation matrix; avoid
  # retaining a second [N,N] tensor in the Python output.
  return_correlation: false
  max_tokens: 0
  # VTMOT injects only affine geometry.  Project global soft matches to a
  # 6-DoF [y,x,1] -> [y,x] field instead of fitting unconstrained dense flow.
  affine_projection: true
  affine_ridge: 1.0e-3

loss:
  charbonnier_eps: 1.0e-3
  weights:
    flow: 1.0
    mind: 0.5
    edge: 0.25
    smooth: 0.05
    # Directly supervise the 6-DoF WLS affine estimate with VTMOT gt_h.
    # It is complementary to dense flow EPE and adds no new network branch.
    affine: 10.0

# Real VTMOT fine-tuning runs only the standalone coarse registration branch.
# RTX 3090 (24 GB): full 480x640 FOV and batch one.  This is the evaluation
# FOV that matters; the older 160x160 3060 crop is only an initialisation run.
vtmot_data:
  target_hw: [480, 640]
  crop_hw: [480, 640]
  train_frame_stride: 5
  eval_frame_stride: 50

vtmot_train:
  seed: 2025
  pilot_steps: 300
  full_steps: 3000
  batch_size: 1
  eval_batch_size: 1
  num_workers: 2
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  amp: true
  log_every: 25
  validation_every: 100
  checkpoint_every: 100
