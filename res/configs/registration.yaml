# Independent single-frame IR--visible registration experiment.
# Stages 1--8 use this configuration; real VTMOT integration remains separate.
mind:
  patch_size: 3
  radius: 1
  eps: 1.0e-6

encoder:
  base_channels: 24
  out_channels: 64
  blocks_per_scale: 2
  eps: 1.0e-6

global_matcher:
  temperature: 0.07
  learnable_temperature: true
  return_correlation: true
  max_tokens: 0
  # VTMOT injects only affine geometry.  Project global soft matches to a
  # 6-DoF [y,x,1] -> [y,x] field instead of fitting unconstrained dense flow.
  affine_projection: true
  affine_ridge: 1.0e-3

registration:
  feature_stride: [8, 8]

dcn:
  kernel_size: 3
  use_residual_flow_head: false
  max_residual_feature_px: 2.0

loss:
  charbonnier_eps: 1.0e-3
  weights:
    flow: 1.0
    mind: 0.5
    edge: 0.25
    smooth: 0.05

synthetic_data:
  length: 4096
  height: 128
  width: 160
  translation_px: 24.0
  rotation_deg: 8.0
  scale_jitter: 0.08
  seed: 1234

synthetic_train:
  seed: 1234
  steps: 1000
  batch_size: 4
  num_workers: 0
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  amp: true
  log_every: 25
  preview_every: 250
  checkpoint_every: 250

# Real VTMOT fine-tuning runs only the standalone coarse registration branch.
# First resize preserves the common 4:3 field of view; then crops keep 3060
# global all-pairs correlation comfortably small during backward propagation.
vtmot_data:
  target_hw: [480, 640]
  crop_hw: [160, 160]
  train_frame_stride: 5
  eval_frame_stride: 50

vtmot_train:
  seed: 2025
  pilot_steps: 300
  full_steps: 3000
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  amp: true
  log_every: 25
  validation_every: 100
  checkpoint_every: 100

ablation:
  use_mind: true
  use_global_matching: true
  use_dcn: true
  use_confidence: true
  use_multiscale_dcn: true
  use_residual_flow_head: false
