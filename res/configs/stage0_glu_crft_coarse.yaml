# New coarse path: CRFT-style z-scored shared features and SA/CA, followed by
# GLU-Net-style fixed 16x16 global cost-volume decoding. Train from scratch.
# MIND remains available in the legacy model but is absent from this input.
architecture: glu_crft

encoder:
  base_channels: 24
  out_channels: 64
  blocks_per_scale: 2
  eps: 1.0e-6
  normalise: false

coarse_decoder:
  grid_hw: [16, 16]
  hidden_channels: 96
  max_displacement_cells: 6.0

coarse_transformer:
  enabled: true
  num_layers: 2
  num_heads: 4
  ffn_ratio: 2

global_matcher:
  temperature: 0.07
  learnable_temperature: true
  return_correlation: false
  max_tokens: 256
  affine_projection: false
  affine_ridge: 1.0e-3
  dual_softmax: true

coarse_refiner:
  enabled: false

local_matcher:
  enabled: false

loss:
  weights:
    match: 1.0
    flow: 1.0
    affine: 10.0
    mind: 0.0
    edge: 0.25
    smooth: 0.05
    local: 0.0
    coarse_local: 0.0
    global_flow: 0.0
    coarse_flow: 0.0

vtmot_train:
  lr: 1.0e-4
